asyncapi: 3.0.0

info:
  title: Regel - Framework Async API
  version: 1.0.0
  description: Generiskt Async API för initiering av regler

channels:
  regel.requests:
    address: regel.requests
    messages:
      RegelRequestMessage:
        $ref: "#/components/messages/RegelRequestMessage"

  regel.responses:
    address: regel.responses
    messages:
      RegelResponseMessage:
        $ref: "#/components/messages/RegelResponseMessage"

operations:
  RegelRequest:
    action: receive
    summary: Initierar evaluering av regeln
    channel:
      $ref: "#/channels/regel.requests"
    reply:
      address:
        description: Resultatet skickas tillbaka till källan.
        location: "$message.header#/replyTo"
      channel:
        $ref: "#/channels/regel.responses"

components:
  schemas:
    RegelRequestMessageHeaders:
      type: object
      properties:
        replyTo:
          type: string
          description: Topic där response ska skickas
        correlationId:
          type: string
          format: uuid
          description: Unikt ID som kopplar ihop request & response

    RegelRequestMessagePayloadData:
      type: object
      title: RegelRequestMessagePayloadData
      required:
        - handlaggningId
        - aktivitetId
      properties:
        handlaggningId:
          type: string
          format: uuid
          description: Unikt ID som identifierar handläggningsärendet
        aktivitetId:
            type: string
            format: uuid
            description: Unikt ID som identifierar aktivitet

    RegelResponseMessageHeaders:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
          description: Unikt ID som kopplar ihop request & response

    RegelFelkod:
      type: string
      pattern: ^[A-Z0-9]([_A-Z0-9]*[A-Z0-9]){0,1}$
      description: |-
        Maskinläsbar felkod som indikerar vilket fel som har inträffat. Felkoder kan fritt definieras av implementerande kod med undantag för koder som börjar med prefixet "RIMFROST_" som är reserverat för felkoder definierade av rimfrost ramverket. Om en felkod inte känns igen så ska den behandlas som om "RIMFROST_OTHER" hade angivits, d.v.s, som om det är ett generiskt fel utan specifik innebörd.

        Följande är de felkoder som för närvarande är definierade av ramverket:

            - RIMFROST_HANDLAGGNING_READ_FAILURE
            - RIMFROST_HANDLAGGNING_WRITE_FAILURE
            - RIMFROST_OTHER

    RegelErrorInformation:
      type: object
      title: RegelErrorInformation
      required:
        - felkod
        - felmeddelande
      properties:
        felkod:
          $ref: '#/components/schemas/RegelFelkod'
          description: Maskinsläsbar felkod, t.ex. INTERN_FEL eller OGILTIG_INDATA
        felmeddelande:
          type: string
          description: Beskrivning av vad som gick fel

    RegelResponseMessagePayloadData:
      type: object
      title: RegelResponseMessagePayloadData
      required:
        - handlaggningId
        - utfall
      properties:
        handlaggningId:
          type: string
          format: uuid
          description: Unikt ID som identifierar handläggningsärendet
        utfall:
          title: utfall
          type: string
          description: Utfall av regel, t.ex. om personen har rätt till försäkring
          enum:
            - Ja
            - Nej
            - Utredning
            - Error
        error:
          $ref: "#/components/schemas/RegelErrorInformation"
          description: Finns endast när utfall är Error, annars null
          nullable: true

  messages:
    RegelRequestMessage:
      headers:
        $ref: "#/components/schemas/RegelRequestMessageHeaders"
      payload:
        title: RegelRequestMessagePayload
        allOf:
          - $ref: "kogito-cloudevent.yaml#/components/schemas/KogitoCloudEvent"
          - type: object
            title: RegelRequestMessagePayloadData
            required:
              - data
            properties:
              data:
                $ref: "#/components/schemas/RegelRequestMessagePayloadData"

    RegelResponseMessage:
      headers:
        $ref: "#/components/schemas/RegelResponseMessageHeaders"
      payload:
        title: RegelResponseMessagePayload
        allOf:
          - $ref: "kogito-cloudevent.yaml#/components/schemas/KogitoCloudEvent"
          - type: object
            title: RegelResponseMessagePayloadData
            required:
              - data
            properties:
              data:
                $ref: "#/components/schemas/RegelResponseMessagePayloadData"
